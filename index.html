<script>
/* ======================= NỘI DUNG THƯ — sửa ở đây ======================= */
const LETTER = String.raw`/**
 * gui_em.js
 * gần 2h sáng, làm xong rồi ngồi viết cho em

gửi na yêu của anh

thời gian qua để em thiệt thòi nhiều rồi,
anh biết hiện giờ em đang rất buồn rất giận
vì anh k đủ gian để quan tâm em nhiều,
có ngày còn k gọi nổi cho em một cuộc,
anh biết anh sai,
anh cũng biết hiểu cho anh ch bao giờ là trách nhiệm của em cả,
em hiểu cho anh thì anh rất biết ơn
nhưng anh đâu có thể vì em hiểu cho anh mà vô tâm mãi dc,

anh biết em buồn em khó chịu
nhưng đặc thù công việc của a là v,
a ở tuổi này a phải cày,
cày thật nhiều cho tương lai hai đứa,
e luôn bảo chắc gì tương lai anh sẽ cưới em
nhưng mà xin hãy tin anh đi,
nếu chỉ cố gắng vì bản thân anh
thì anh đã có thể nghỉ tay sau dự án trước,

anh luôn có nỗi lo về tài chính,
k có tiền a tự ti lắm,
k có tiền anh cũng cảm giác bản thân k lo dc cho em,
k xứng với em.

Nhớ anh từng nói gì k,
ngừoi đàn ổng của em có thể k tinh tế,
hơi vô duyên nhưng nhất định sẽ tâm lý và cực giàu,
chào em anh là Bin một người đang cố gắng trở nên giàu
đến nỗi có thể mua cả mặt trăng cho Na thúi,
anh k mong em sẽ tha thứ cho anh
nhưng chỉ mong em tin anh, đợi anh.

Bin
*/

if (anhKiemDuoc >= 1_000_000_000) {
  CuoiEm();
}

// git commit -m "cho anh 1 năm"`;
/* ======================================================================== */


// ---------------------------------------------------------------- letter, typed out
const KW = new Set(['const', 'let', 'var', 'while', 'for', 'if', 'return', 'function', 'true', 'false', 'new']);
function tokenize(line) {
  const t = line.trimStart();
  if (t.startsWith('//') || t.startsWith('/*') || t.startsWith('*')) return [[line, 'c-com']];
  const out = [], re = /("[^"]*"?)|(\d[\d_]*)|([A-Za-z_À-ỹ][\wÀ-ỹ]*)(\s*\()?|(\s+)|([^\sA-Za-z_\d"]+)/gu;
  let m;
  while ((m = re.exec(line))) {
    if (m[1]) out.push([m[1], 'c-str']);
    else if (m[2]) out.push([m[2], 'c-num']);
    else if (m[3]) {
      out.push([m[3], KW.has(m[3]) ? (m[3] === 'const' || m[3] === 'let' ? 'c-dec' : 'c-kw') : m[4] ? 'c-fn' : 'c-var']);
      if (m[4]) out.push([m[4], 'c-pun']);
    }
    else if (m[5]) out.push([m[5], '']);
    else out.push([m[6], 'c-pun']);
  }
  return out;
}
const codeEl = document.getElementById('code'), posEl = document.getElementById('pos');
let inBlock = false;
const LINES = LETTER.split('\n').map(line => {
  const t = line.trim();
  if (inBlock) { if (t.endsWith('*/')) inBlock = false; return [[line, 'c-com']]; }
  if (t.startsWith('/*')) { inBlock = !t.endsWith('*/'); return [[line, 'c-com']]; }
  return tokenize(line);
});
const cursor = document.createElement('span'); cursor.className = 'cursor';
let li = 0, ti = 0, ci = 0, lineEl = null, spanEl = null, typing = false, done = false, timer;

function newLine(follow) {
  // keep the cursor in view while the reader is following along (not if they scrolled away)
  const r = cursor.getBoundingClientRect(), following = follow && r.top > 0 && r.bottom < innerHeight + 40;
  const d = document.createElement('div'); d.className = 'ln';
  const t = document.createElement('span'); t.className = 't'; d.appendChild(t);
  codeEl.appendChild(d); lineEl = t; spanEl = null; t.appendChild(cursor);
  if (following && d.getBoundingClientRect().bottom > innerHeight - 90) scrollBy({ top: 120, behavior: 'smooth' });
}
function step() {
  if (li >= LINES.length) { done = true; document.getElementById('skip').style.visibility = 'hidden'; return; }
  if (!lineEl) newLine(true);
  const toks = LINES[li];
  if (ti >= toks.length) {                                  // end of line
    li++; ti = 0; ci = 0; lineEl = null;
    const blank = !toks.length || (toks.length === 1 && toks[0][0] === '//');
    timer = setTimeout(step, blank ? 260 : 420 + Math.random() * 260);
    return;
  }
  const [text, cls] = toks[ti];
  if (!spanEl) { spanEl = document.createElement('span'); if (cls) spanEl.className = cls; lineEl.insertBefore(spanEl, cursor); }
  const chr = text[ci++];
  spanEl.textContent += chr;
  if (ci >= text.length) { ti++; ci = 0; spanEl = null; }
  posEl.textContent = `Ln ${li + 1}, Col ${lineEl.textContent.length + 1}`;
  let d = 38 + Math.random() * 45;
  if (/[.!?]/.test(chr)) d += 380; else if (/[,:;]/.test(chr)) d += 170; else if (chr === ' ' && Math.random() < .05) d += 240;
  if (cls === 'c-com' && ci === 2 && text.trimStart().startsWith('//')) d = 20;   // the "//" prefix types fast
  timer = setTimeout(step, d);
}
function finishAll() {
  if (done) return;
  clearTimeout(timer);
  codeEl.innerHTML = '';
  for (const toks of LINES) {
    newLine();
    for (const [text, cls] of toks) { const s = document.createElement('span'); if (cls) s.className = cls; s.textContent = text; lineEl.insertBefore(s, cursor); }
  }
  li = LINES.length; posEl.textContent = `Ln ${LINES.length}, Col ${LINES[LINES.length - 1].map(t => t[0]).join('').length + 1}`; step();
}
document.querySelector('.editor').addEventListener('click', finishAll);
new IntersectionObserver(([e], ob) => {
  if (e.isIntersecting && !typing) { typing = true; ob.disconnect(); setTimeout(step, 600); }
}, { threshold: .25 }).observe(document.getElementById('letter'));
</script>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

// ============================================================ setup
const Q = new URLSearchParams(location.search);
const hero = document.querySelector('.hero');
const cv = document.getElementById('c');
const V3 = THREE.Vector3;
const SS = 3;                                     // scene samples per glyph cell (each axis)
let W, H, DPR, cellCss = +Q.get('cell') || (innerWidth < 700 ? 2.5 : 2), cw, ch, cols, rows, t0, heroVisible = true;

let seed = 7;
const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const R2 = (a, b) => a + (b - a) * rnd();
const lerp = (a, b, k) => a + (b - a) * k;
const clamp01 = x => Math.max(0, Math.min(1, x));
const ease = x => (x = clamp01(x), 1 - Math.pow(1 - x, 3));
const easeIO = x => (x = clamp01(x), x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const rgba = (h, a) => { const [r, g, b] = hex(h); return `rgba(${r},${g},${b},${a})`; };

const renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: false, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
renderer.toneMapping = THREE.NoToneMapping;
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(30, 1, .1, 100);
const pivotG = new THREE.Group(); pivotG.position.y = 2.75; scene.add(pivotG);
const bouquet = new THREE.Group(); bouquet.position.y = -2.75; pivotG.add(bouquet);

// lights: soft sky, warm key from upper-left, pink rim from behind
scene.add(new THREE.HemisphereLight(0xfff2f6, 0x1e2a14, 1.3));
const key = new THREE.DirectionalLight(0xffffff, 3.2); key.position.set(-4, 6, 5); scene.add(key);
const rim = new THREE.DirectionalLight(0xff9cc8, 2.2); rim.position.set(4, 3, -5); scene.add(rim);
const fill = new THREE.DirectionalLight(0xffe6d0, .7); fill.position.set(5, 0, 4); scene.add(fill);

// ============================================================ textures
function canvasTex(w, h, draw, srgb = true) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
const VARIETY = {
  stargazer: { main: '#ec3a8a', deep: '#bf0d5a', edge: '#fde4ef', vein: '#9a0646', throat: '#d6e86a', spot: '#7c0830', spots: 80 },
  blush:     { main: '#f58fbd', deep: '#e0508e', edge: '#fff3f8', vein: '#c02c6c', throat: '#dcec7c', spot: '#a81c4a', spots: 55 },
  white:     { main: '#fff3f2', deep: '#fbdde6', edge: '#ffffff', vein: '#e2b4c4', throat: '#c4e06c', spot: '#e0708e', spots: 22 },
};
function petalTexture(V) {
  return canvasTex(256, 512, (x, w, h) => {
    x.fillStyle = V.edge; x.fillRect(0, 0, w, h);
    // colour band across the petal, strongest along the middle, fading towards the tip
    const band = document.createElement('canvas'); band.width = w; band.height = h; const b = band.getContext('2d');
    let g = b.createLinearGradient(0, 0, w, 0);
    g.addColorStop(0, rgba(V.main, 0)); g.addColorStop(.16, rgba(V.main, .9)); g.addColorStop(.4, V.deep);
    g.addColorStop(.6, V.deep); g.addColorStop(.84, rgba(V.main, .9)); g.addColorStop(1, rgba(V.main, 0));
    b.fillStyle = g; b.fillRect(0, 0, w, h);
    b.globalCompositeOperation = 'destination-in';
    g = b.createLinearGradient(0, 0, 0, h); g.addColorStop(0, 'rgba(0,0,0,.2)'); g.addColorStop(.3, 'rgba(0,0,0,.9)'); g.addColorStop(1, 'rgba(0,0,0,1)');
    b.fillStyle = g; b.fillRect(0, 0, w, h);
    x.drawImage(band, 0, 0);
    // fine veins fanning out from the base
    x.lineWidth = 1.1;
    for (let i = 0; i < 34; i++) {
      const f = i / 33 * 2 - 1; x.strokeStyle = rgba(V.vein, .16 + .14 * (1 - Math.abs(f)));
      x.beginPath(); x.moveTo(w / 2 + f * 8, h); x.bezierCurveTo(w / 2 + f * w * .22, h * .62, w / 2 + f * w * .44, h * .3, w / 2 + f * w * .4, 0); x.stroke();
    }
    // green-yellow nectary furrow at the throat
    g = x.createLinearGradient(0, h, 0, h * .5); g.addColorStop(0, V.throat); g.addColorStop(1, rgba(V.throat, 0));
    x.fillStyle = g; x.beginPath(); x.ellipse(w / 2, h, w * .09, h * .46, 0, 0, 7); x.fill();
    x.strokeStyle = rgba(V.vein, .75); x.lineWidth = 3; x.beginPath(); x.moveTo(w / 2, h * .55); x.lineTo(w / 2, h * .04); x.stroke();
    // raised papillae spots on the lower half
    for (let i = 0; i < V.spots; i++) {
      const sy = h * (.42 + Math.pow(rnd(), .8) * .46), spread = (sy / h - .35) * 1.3, sx = w / 2 + (rnd() - .5) * w * .62 * spread, r = 1.6 + rnd() * 4.4;
      x.fillStyle = V.spot; x.beginPath(); x.ellipse(sx, sy, r * .75, r * 1.35, (rnd() - .5) * .4, 0, 7); x.fill();
      x.fillStyle = 'rgba(255,255,255,.4)'; x.beginPath(); x.arc(sx - r * .2, sy - r * .45, r * .28, 0, 7); x.fill();
    }
    g = x.createLinearGradient(0, 0, 0, h * .18); g.addColorStop(0, rgba(V.edge, .75)); g.addColorStop(1, rgba(V.edge, 0));
    x.fillStyle = g; x.fillRect(0, 0, w, h * .18);
    // thin pale rim
    x.strokeStyle = rgba(V.edge, .9); x.lineWidth = 6; x.strokeRect(0, 0, w, h);
  });
}
// grain + raised veins for the bump map, so surfaces read as matte and textured rather than plastic
function grainTexture(w, h, veins) {
  return canvasTex(w, h, (x) => {
    const img = x.createImageData(w, h), d = img.data;
    for (let i = 0; i < w * h; i++) { const n = 128 + (Math.random() - .5) * 150; d[i * 4] = d[i * 4 + 1] = d[i * 4 + 2] = n; d[i * 4 + 3] = 255; }
    x.putImageData(img, 0, 0);
    for (let k = 0; k < 1400; k++) { x.fillStyle = `rgba(${Math.random() < .5 ? '0,0,0' : '255,255,255'},.25)`; x.fillRect(Math.random() * w, Math.random() * h, 1 + Math.random() * 2, 1 + Math.random() * 3); }
    if (veins) {
      x.lineWidth = 1.4;
      for (let i = 0; i < veins; i++) {
        const f = i / (veins - 1) * 2 - 1; x.strokeStyle = 'rgba(255,255,255,.55)';
        x.beginPath(); x.moveTo(w / 2 + f * 8, h); x.bezierCurveTo(w / 2 + f * w * .22, h * .62, w / 2 + f * w * .44, h * .3, w / 2 + f * w * .4, 0); x.stroke();
      }
    }
  }, false);
}
const PETAL_BUMP = grainTexture(256, 512, 34), LEAF_BUMP = grainTexture(128, 512, 9), STEM_BUMP = grainTexture(128, 128, 0);
const PETAL_TEX = Object.fromEntries(Object.entries(VARIETY).map(([k, V]) => [k, petalTexture(V)]));
const LEAF_TEX = canvasTex(128, 512, (x, w, h) => {
  const g = x.createLinearGradient(0, 0, w, 0);
  g.addColorStop(0, '#2c6a20'); g.addColorStop(.45, '#58a63a'); g.addColorStop(.5, '#8ccc62'); g.addColorStop(.55, '#58a63a'); g.addColorStop(1, '#2c6a20');
  x.fillStyle = g; x.fillRect(0, 0, w, h);
  x.strokeStyle = 'rgba(190,240,150,.35)'; x.lineWidth = 1;
  for (let i = 1; i < 8; i++) { const f = i / 8; x.beginPath(); x.moveTo(w * f, h); x.quadraticCurveTo(w * (.5 + (f - .5) * 1.1), h * .5, w / 2, 0); x.stroke(); }
});

// ============================================================ geometry helpers
function gridGeo(su, sv) {
  const g = new THREE.BufferGeometry(), n = (su + 1) * (sv + 1);
  const uv = new Float32Array(n * 2), idx = [];
  for (let i = 0; i <= su; i++) for (let j = 0; j <= sv; j++) { const k = i * (sv + 1) + j; uv[k * 2] = j / sv; uv[k * 2 + 1] = i / su; }
  for (let i = 0; i < su; i++) for (let j = 0; j < sv; j++) {
    const a = i * (sv + 1) + j, b = a + 1, c = a + sv + 1, d = c + 1; idx.push(a, c, b, b, c, d);
  }
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n * 3), 3));
  g.setAttribute('uv', new THREE.BufferAttribute(uv, 2)); g.setIndex(idx);
  return g;
}
function fillGrid(g, su, sv, fn) {
  const p = g.attributes.position.array;
  for (let i = 0; i <= su; i++) for (let j = 0; j <= sv; j++) { const k = (i * (sv + 1) + j) * 3, q = fn(i / su, j / sv * 2 - 1); p[k] = q.x; p[k + 1] = q.y; p[k + 2] = q.z; }

  const half = Math.tan(cam.fov * Math.PI / 360), needH = 5.2, needW = aspect < .8 ? 4.1 : 4.8;
  const dist = Math.max(needH, needW / aspect) / (2 * half);
  cam.position.set(0, 2.7, dist); cam.lookAt(0, aspect < .8 ? 2.65 : 2.55, 0); cam.updateProjectionMatrix();
}
// configure for a drawing buffer of bw×bh device pixels with glyph cells of cellDev px wide
function configure(bw, bh, cellDev) {
  cw = Math.max(3, Math.round(cellDev)); ch = Math.round(cw / .6);
  cols = Math.ceil(bw / cw); rows = Math.ceil(bh / ch);
  if (rt) rt.dispose();
  rt = new THREE.WebGLRenderTarget(cols * SS, rows * SS, { type: THREE.HalfFloatType, samples: 4 });
  if (atlas) atlas.tex.dispose();
  atlas = buildAtlas(cw, ch);
  const u = asciiMat.uniforms;
  u.uScene.value = rt.texture; u.uAtlas.value = atlas.tex; u.uN.value = atlas.n;
  u.uRes.value.set(bw, bh); u.uGrid.value.set(cols, rows); u.uCell.value.set(cw, ch);
  fitCamera(bw / bh);
}
function layout() {
  DPR = Math.min(2, devicePixelRatio || 1);
  W = hero.clientWidth; H = hero.clientHeight;
  renderer.setPixelRatio(DPR); renderer.setSize(W, H, false);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  configure(Math.round(W * DPR), Math.round(H * DPR), cellCss * DPR);
}
function render(t) {
  update(t);
  renderer.setRenderTarget(rt); renderer.setClearColor(0x000000, 0); renderer.clear(); renderer.render(scene, cam);
  renderer.setRenderTarget(null); asciiMat.uniforms.uTime.value = t; asciiMat.uniforms.uStars.value = clamp01(t / 2.5);
  renderer.render(quadScene, quadCam);
}
function replay() { t0 = performance.now(); for (const F of FLOWERS) F.o = -1; document.getElementById('down').classList.remove('on'); hintEl.classList.add('on'); setTimeout(hideHint, 9000); }
function loop(now) {
  if (heroVisible) {
    const t = (now - t0) / 1000; render(t);
    if (t > 15) document.getElementById('down').classList.add('on');
  }
  requestAnimationFrame(loop);
}

// 4K still: re-render the current moment at 3840×2160 with proportionally sized glyphs
function export4K() {
  const t = (performance.now() - t0) / 1000, bw = 3840, bh = 2160, cell = cellCss * DPR * (bh / (H * DPR));
  renderer.setPixelRatio(1); renderer.setSize(bw, bh, false);
  configure(bw, bh, Math.max(6, Math.min(cell, 26)));
  render(t);
  const url = cv.toDataURL('image/png');
  layout();
  const a = document.createElement('a'); a.download = 'bo-hoa-ly-4k.png'; a.href = url; a.click();
}

// ============================================================ UI
const resEl = document.getElementById('res');
resEl.min = 2; resEl.max = 12; resEl.step = .5; resEl.value = cellCss;
const resV = document.getElementById('resv'); const showRes = () => resV.textContent = cellCss + 'px';
resEl.oninput = () => { cellCss = +resEl.value; showRes(); layout(); }; showRes();
document.getElementById('replay').onclick = e => { e.stopPropagation(); replay(); };
document.getElementById('shot').onclick = e => { e.stopPropagation(); export4K(); };
document.getElementById('shot').title = 'Lưu ảnh 4K (3840×2160)';
let lastW = 0, lastH = 0, rtm;
addEventListener('resize', () => { clearTimeout(rtm); rtm = setTimeout(() => {
  if (hero.clientWidth === lastW && Math.abs(hero.clientHeight - lastH) < 140) return;
  lastW = hero.clientWidth; lastH = hero.clientHeight; layout();
}, 150); });
new IntersectionObserver(([e]) => { heroVisible = e.isIntersecting; }).observe(hero);
layout(); lastW = W; lastH = H; replay();
requestAnimationFrame(loop);
window.__lily = { render, update, layout, configure, setT: s => { t0 = performance.now() - s * 1000; }, export4K, FLOWERS, cam, renderer, scene, bouquet };

</script>
